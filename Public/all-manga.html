<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#121f26">
  <title>All Manga | Mirai Manga</title>
  <link rel="stylesheet" href="Css/manga.css">
  <link rel="stylesheet" href="Css/footer.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
</head>
<body>
  <header class="site-header" id="page-top">
    <nav class="nav-container" aria-label="Main navigation">
      <button class="nav-icon-button menu-toggle" type="button" aria-label="Open menu" aria-expanded="false" aria-controls="site-menu">
        <i class="fa-solid fa-bars" aria-hidden="true"></i>
      </button>
      <a class="brand" href="home.html" aria-label="Mirai Manga home">
        <img src="Assets/logo.png" alt="Mirai Manga" width="128" height="38">
      </a>
      <div class="nav-search all-manga-search">
        <i class="fa-solid fa-magnifying-glass search-icon" aria-hidden="true"></i>
        <input id="all-manga-search" type="search" placeholder="Search manga..." autocomplete="off" aria-label="Search manga">
        <button class="mobile-search-close" type="button" aria-label="Close search">
          <i class="fa-solid fa-xmark" aria-hidden="true"></i>
        </button>
      </div>
      <div class="nav-actions">
        <button class="nav-icon-button mobile-search-toggle" type="button" aria-label="Open search" aria-expanded="false">
          <i class="fa-solid fa-magnifying-glass" aria-hidden="true"></i>
        </button>
        <a class="sign-in-button" href="https://anilist.co" target="_blank" rel="noopener noreferrer">AniList</a>
      </div>
    </nav>
  </header>

  <div class="nav-menu" id="site-menu" aria-hidden="true" hidden>
    <nav class="nav-drawer" aria-label="Site menu">
      <div class="nav-drawer-header">
        <a class="nav-drawer-brand" href="home.html" aria-label="Mirai Manga home">
          <img src="Assets/logo.png" alt="" width="128" height="38">
        </a>
        <button class="nav-drawer-close" type="button" aria-label="Close menu">
          <i class="fa-solid fa-xmark" aria-hidden="true"></i>
        </button>
      </div>
      <a class="nav-drawer-account" href="https://anilist.co" target="_blank" rel="noopener noreferrer">
        <i class="fa-regular fa-user" aria-hidden="true"></i>
        <span>Sign In / Sign Up</span>
      </a>
      <div class="nav-drawer-section">
        <h2 class="nav-drawer-label">Browse</h2>
        <a class="nav-drawer-link" href="home.html#page-top">
          <span class="nav-drawer-icon"><i class="fa-solid fa-house" aria-hidden="true"></i></span>
          <span>Home</span>
        </a>
        <a class="nav-drawer-link is-current" href="all-manga.html" aria-current="page">
          <span class="nav-drawer-icon"><i class="fa-solid fa-border-all" aria-hidden="true"></i></span>
          <span>All Manga</span>
        </a>
        <button class="nav-drawer-link nav-drawer-search" type="button">
          <span class="nav-drawer-icon"><i class="fa-solid fa-tags" aria-hidden="true"></i></span>
          <span>Genre</span>
        </button>
        <button class="nav-drawer-link nav-drawer-search" type="button">
          <span class="nav-drawer-icon"><i class="fa-solid fa-layer-group" aria-hidden="true"></i></span>
          <span>Types</span>
        </button>
      </div>
      <a class="nav-drawer-community" href="https://discord.gg/sxFWDnvRP" target="_blank" rel="noopener noreferrer">
        <span class="nav-drawer-community-icon"><i class="fa-brands fa-discord" aria-hidden="true"></i></span>
        <span class="nav-drawer-community-copy">
          <strong>Join our Discord</strong>
          <span>News, requests &amp; chat</span>
        </span>
        <i class="fa-solid fa-chevron-right" aria-hidden="true"></i>
      </a>
    </nav>
  </div>

  <main class="all-manga-main">
    <header class="all-manga-heading">
      <p class="all-manga-eyebrow">ANILIST CATALOG</p>
      <h1>All Manga</h1>
      <p>Browse AniList manga, sorted by popularity. More titles load as you go.</p>
      <p class="all-manga-count" id="all-manga-count" aria-live="polite">Loading manga…</p>
    </header>
    <div class="all-manga-grid" id="all-manga-grid" aria-live="polite"></div>
    <p class="all-manga-status" id="all-manga-status" role="status"></p>
    <button class="all-manga-more" id="load-more-manga" type="button" hidden>Load more manga</button>
  </main>

  <footer class="all-manga-footer">
    Manga metadata provided by <a href="https://anilist.co" target="_blank" rel="noopener noreferrer">AniList</a>.
    <a href="home.html">Back to home</a>
  </footer>

  <script src="javascript/manga.js" defer></script>
  <script src="javascript/all-manga.js" defer></script>
</body>
</html>
